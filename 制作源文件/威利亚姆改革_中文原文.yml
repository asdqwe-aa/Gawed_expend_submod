 gcd_welyam.20.b:0 "巩固王室的权力。"
 gcd_welyam.30.t:0 "威利亚姆的大围猎"
 gcd_welyam.30.a:0 "召集宾客。"
 gcd_welyam.40.t:0 "威斯特摩尔倒戈"
 gcd_welyam.40.a:0 "我们已知晓他们的选择。"
 gcd_welyam.100.t:0 "加韦德内战"
 gcd_welyam.100.a:0 "王国已然分裂。"
 gcd_welyam.101.t:0 "加韦德内战：加韦顿陷落"
 gcd_welyam.101.a:0 "王室败局已定。"
 gcd_welyam.102.t:0 "加韦德内战：王室的胜利"
 gcd_welyam.102.a:0 "重归王室治下。"
 gcd_welyam.103.t:0 "内战暂缓"
 gcd_welyam.103.d:0 "王室仅存首都，已无可用于建立大边区的非首都领土。内战尚未开始；大领主的威胁仍未消失。"
 gcd_welyam.103.a:0 "我们需要应对这场危机。"
 gcd_welyam_first_council:0 "第一次富商议会"
 gcd_welyam_royal_right_hand:0 "国王的左膀右臂"
 gcd_welyam_noble_settlement:0 "大领主的誓言"
 gcd_welyam_crown_consolidation:0 "王室权力的扩张"
 gcd_welyam_great_hunt:0 "威利亚姆的大围猎"
 gcd_welyam_great_hunt_karina:0 "威利亚姆与卡丽娜的大围猎"
 gcd_welyam_council_preview_tt:0 "§Y事件前瞻：第一次富商议会§!\n事件选项将给予 §G25§! 政府改革点数、§G100§! 金币，以及持续到当前君主死亡的 §G−20%§! 顾问花费。"
 gcd_welyam_rebels_stopped_tt:0 "§G解除威利亚姆改革施加的富商贷款禁令。§!\n此后不再触发本灾难两年一次的贵族叛军；已有叛军仍需处理。贵族忠诚均衡点 §R−10%§!，持续到灾难结束。"
 gcd_welyam_settlement_preview_tt:0 "§Y事件前瞻：不得不面对之人§!\n可选“接受大领主的誓言”：贵族忠诚均衡点 §G+30%§!、贵族影响力 §Y−10%§!，持续到灾难结束。"
 gcd_welyam_consolidation_preview_tt:0 "§Y事件前瞻：不得不面对之人§!\n可选“巩固王室的权力”：全国叛乱度 §R+2§!、月度自治度 §G−0.1§!，持续 §Y10 年§!。"
 gcd_welyam_civil_war_prevented_tt:0 "§G选择此选项后，加韦德内战将不再触发。§! 已经爆发的内战仍须通过战争结局结束。"
 gcd_welyam_hunt_preview_tt:0 "§Y事件前瞻：威利亚姆的大围猎§!\n事件选项将使所有阶层忠诚度 §G+10§!，并给予持续 §Y15 年§! 的人情增长 §G+20%§!、外交声誉 §G+2§!。若选择选项时配偶为 §YKarina Deland§!，该修正额外给予侵略扩张影响 §G−15%§!、外交声誉 §G+2§!（合计 §G+4§!）。"
 gcd_welyam_reform_finished_tt:0 "§G威利亚姆改革灾难结束。§! 随灾难结束的修正和富商借款禁令一并清除。"
 gcd_welyam_civil_war_start_tt:0 "释放所有可释放国家及现有属国。大边区以“加韦德内战”为由对我们宣战，目标为加韦顿；格威克、西山、鹰冠、金菲尔德和威斯特摩尔加入大边区一方。\n§R无法手动议和。§! 大边区一方攻占加韦顿，或加韦德对大边区取得 §Y99§! 战争分数时，将触发相应的战争结束事件。"
 gcd_welyam_lords_victory_tt:0 "§R大边区吞并加韦德，当前加韦德玩家将失去国家。§! 格威克、西山、鹰冠和金菲尔德成为大边区的附庸。威斯特摩尔保持独立。"
 gcd_welyam_crown_victory_tt:0 "§G加韦德吞并大边区、格威克、西山、鹰冠、金菲尔德和威斯特摩尔。§! 改革灾难仍须通过“威利亚姆之治”结束。"
 gcd_welyam_westmoors_defected_tt:0 "威斯特摩尔已脱离王室，加入我们主动宣战的敌方阵营。"
 gcd_welyam_no_manual_peace_tt:0 "加韦德内战只能由加韦顿陷落或加韦德达到 99 战争分数后触发的事件结束，不能手动或单独议和。"
 cb_gcd_gawedi_civil_war:0 "加韦德内战"
 cb_gcd_gawedi_civil_war_desc:0 "大领主与王室的决裂。夺取加韦顿，或由王室在达到 99 战争分数时统一王国。"
 gcd_gawedi_civil_war_capital:0 "夺取加韦顿"
 gcd_gawedi_civil_war_capital_desc:0 "大边区一方必须攻占加韦顿。"
 GCD_GAWEDI_CIVIL_WAR_NAME:0 "加韦德内战"
